name: Deploy to Google Play

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. PRIMERO creamos el archivo de Firebase ANTES del prebuild
      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

      # 2. AHORA Expo ya puede encontrar el archivo y compilar
      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $ANDROID_KEYSTORE_BASE64 | base64 --decode > android/app/keystore.jks

      - name: Build Android App Bundle (.aab)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      # 3. Creamos el archivo EXACTO que Fastlane necesita para subir a la tienda
      - name: Create Google Play Config JSON
        run: echo '${{ secrets.PLAY_CONFIG_JSON }}' > google-play.json

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Fastlane - Upload to Google Play
        run: |
          gem install fastlane
          fastlane run upload_to_play_store \
            track:internal \
            aab:android/app/build/outputs/bundle/release/app-release.aab \
            json_key:google-play.json \
            package_name:com.bosatzu.empleosnarino \
            skip_upload_metadata:true \
            skip_upload_images:true \
            skip_upload_screenshots:true